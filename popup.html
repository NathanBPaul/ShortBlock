<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShortBlock</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <img class="logo" src="icons/icon48.png" alt="ShortBlock logo">
      <div>
        <h1>ShortBlock</h1>
        <p>Your friendly neighbourhood distraction blocker.</p>
      </div>
    </header>

    <fieldset>
      <legend>YouTube Shorts</legend>

      <label class="option">
        <input type="radio" name="youtube-mode" value="off">
        <span>
          <strong>Off</strong>
          <small>Allow Shorts normally</small>
        </span>
      </label>

      <label class="option">
        <input type="radio" name="youtube-mode" value="first">
        <span>
          <strong>Block the first scroll</strong>
          <small>Interrupt when you try to advance</small>
        </span>
      </label>

      <label class="option">
        <input type="radio" name="youtube-mode" value="all">
        <span>
          <strong>Block all Shorts</strong>
          <small>Hide entry points and block direct access</small>
        </span>
      </label>

      <p id="youtube-status" class="status" role="status">
        Loading settings…
      </p>
    </fieldset>

    <div class="section-divider"></div>

    <fieldset>
      <legend>Instagram Reels</legend>

      <label class="option">
        <input type="radio" name="instagram-mode" value="off">
        <span>
          <strong>Off</strong>
          <small>Allow Reels normally</small>
        </span>
      </label>

      <label class="option">
        <input type="radio" name="instagram-mode" value="all">
        <span>
          <strong>Block all Reels</strong>
          <small>Hide Reel entry points and block Reel pages</small>
        </span>
      </label>
      
      <label class="option">
        <input type="radio" name="instagram-mode" value="first">
        <span>
          <strong>Block after first Reel</strong>
          <small>Watch one and block attempts to advance</small>
        </span>
      </label>

      <p id="instagram-status" class="status" role="status">
        Loading settings…
      </p>
    </fieldset>
  </main>
</body>
</html>
